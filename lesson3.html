<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Forms -->
    <!-- form
    inputs - attributes (type, name, id, placeholder)
        text input
        password input
        file input
        date input
        number input - find this one out
        textarea
        select (Has <option></option> to select from a dropdown)
        radios
        checkboxes
    label
    buttons -->

    <form>

        <!-- form elements -->
        <div>
            <label>Name</label><br>
            <input name="name" type="text" placeholder="Enter your name">
        </div>

        <div>
            <label>Password</label> <br>
            <input name="password" type="password" placeholder="Enter your password">
        </div>

        <div>
            <label>File</label> <br>
            <input type="file">
        </div>

        <div>
            <label>Date of Birth</label> <br>
            <input type="date">
        </div>

        <div>
            <label>Your Bio</label> <br>
            <textarea rows="10" cols="40" placeholder="Tell us about yourself..."></textarea>
        </div>

        <div>
            <label>Your gender</label> <br>
            <select>
                <option>I dont have</option>
                <option>Male</option>
                <option>Female</option>
                <option>Dolphine</option>
            </select>
        </div>

        <br><br>
        <div>
            <label>Choose one</label> <br>
            <input type="radio" name="choice"> Yes <br>
            <input type="radio" name="choice"> No <br>
        </div>
        <br><br>
        <div>
            <label>Prefered Language</label> <br>
            <input type="checkbox"> English <br>
            <input type="checkbox"> Swahili <br>
            <input type="checkbox"> Luo <br>
            <input type="checkbox"> Kisii <br>
        </div>

        <br><br>
        
        <div>

            <button>Submit</button>

        </div>

    </form>

    <!-- submit button sends the form data to a server side programe that uses a language e.g. php -->
    
</body>
</html>
